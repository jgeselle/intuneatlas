name: Release

# Push a version tag (e.g. `v0.1.0`) to trigger — builds standalone Windows
# and Linux executables end to end and attaches both to a GitHub Release.
#
# The Windows job only runs on a real Windows runner because the SEA
# packaging step (scripts/build-sea.mjs) patches a real Windows node.exe
# binary — that can't be done from Linux. Both jobs' output have been
# verified for real: the Linux binary in this repo's own dev sandbox, and
# the Windows one via install.ps1 on real Windows hardware.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript + web UI)
        run: npm run build

      - name: Package the standalone exe
        run: npm run package

      # build/intuneatlas.exe ships unsigned, deliberately — this is an
      # unmonetized solo project, and a code-signing cert is a recurring
      # cost that buys publisher-reputation trust, which the build
      # provenance + SBOM attestations below establish more specifically
      # anyway (see the README's Trust model section). Windows will show a
      # SmartScreen warning on first run as a result — a real UX cost, not
      # a security gap.

      - name: Assemble the release folder
        shell: pwsh
        run: |
          $dest = "release/intuneatlas"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item build/intuneatlas.exe $dest/
          Copy-Item -Recurse web/dist $dest/web/dist
          Copy-Item -Recurse baselines $dest/baselines
          Compress-Archive -Path $dest -DestinationPath "release/intuneatlas-windows.zip"

      # Cross-platform npm command; running it under bash avoids pwsh's
      # UTF-16 default for `>` redirection on Windows runners.
      - name: Generate SBOM
        shell: bash
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/intuneatlas-windows.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: release/intuneatlas-windows.zip
          sbom-path: sbom.cdx.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/intuneatlas-windows.zip
          generate_release_notes: true

  build-linux-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript + web UI)
        run: npm run build

      - name: Package the standalone binary
        run: npm run package

      - name: Assemble the release folder
        run: |
          dest="release/intuneatlas"
          mkdir -p "$dest/web"
          cp build/intuneatlas "$dest/"
          chmod +x "$dest/intuneatlas"
          cp -r web/dist "$dest/web/dist"
          cp -r baselines "$dest/baselines"
          tar -czf release/intuneatlas-linux.tar.gz -C release intuneatlas

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/intuneatlas-linux.tar.gz

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: release/intuneatlas-linux.tar.gz
          sbom-path: sbom.cdx.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/intuneatlas-linux.tar.gz
          generate_release_notes: true
