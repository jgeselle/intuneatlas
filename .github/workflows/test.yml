name: Test

# Runs on every push/PR touching main — unlike release.yml (which only ever
# fires on a version tag and builds the shipped binaries), this is the gate
# that actually runs before code lands, not after it's already tagged for
# release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Test
        run: npm test
