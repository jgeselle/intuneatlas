- id: update.quality-deferral
  name: Quality update deferral
  platform: windows
  path: ./Device/Vendor/MSFT/Policy/Config/Update/DeferQualityUpdatesPeriodInDays
  expect:
    max: 7
  severity: high
  source: CIS Microsoft Windows 11 Benchmark, L1
  rationale: >
    Deferring quality updates (which include security patches) much
    beyond a week leaves known, actively-patched vulnerabilities
    unaddressed for longer than necessary.
